<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the DetailBot waitlist</title>
<meta name="description" content="DetailBot gives car detailing businesses proven Facebook ads. Sign up to hear when spots open.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="canonical" href="https://getdetailbot.com/waitlist">
<meta property="og:title" content="Join the DetailBot waitlist">
<meta property="og:description" content="DetailBot gives car detailing businesses proven Facebook ads. Sign up to hear when spots open.">
<meta property="og:url" content="https://getdetailbot.com/waitlist">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#000;
  color:#fff;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;
}
.stage{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:min(400px,calc(100% - 40px));
  padding:48px 0 24px;
}
.col{width:100%;text-align:center}
.mark{
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  margin:0 auto 18px;
  border-radius:14px;
  background:#1c1c1c;
  border:1px solid rgba(255,255,255,.08);
}
.mark img{width:28px;height:28px;border-radius:8px;display:block}
.badge{
  display:inline-block;
  margin:0 0 22px;
  padding:6px 12px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  color:#e4e4e4;
  font-size:13px;
  font-weight:500;
  line-height:1.2;
}
h1{
  margin:0 0 12px;
  font-size:32px;
  line-height:1.15;
  letter-spacing:-.03em;
  font-weight:700;
}
.lede{
  margin:0 0 28px;
  color:#8a8a8a;
  font-size:15px;
  line-height:1.55;
}
form{margin:0}
.sr{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
.hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
input[type="email"]{
  width:100%;
  appearance:none;
  background:#2a2a2a;
  border:1px solid transparent;
  color:#fff;
  border-radius:10px;
  padding:14px 16px;
  font:inherit;
  font-size:15px;
  text-align:left;
}
input::placeholder{color:#8a8a8a}
input:focus-visible{outline:2px solid #bfdbfe;outline-offset:3px}
input[aria-invalid="true"]{border-color:#f87171}
input:-webkit-autofill{
  -webkit-text-fill-color:#fff;
  caret-color:#fff;
  box-shadow:0 0 0 1000px #2a2a2a inset;
}
button{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:10px;
  padding:14px 16px;
  background:#f4f4f5;
  color:#111;
  font:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}
button:hover{background:#fff}
button:focus-visible{outline:2px solid #bfdbfe;outline-offset:3px}
button:disabled{cursor:progress;opacity:.72}
.status{min-height:1.2em;margin:12px 0 0;text-align:center;font-size:14px;font-weight:600}
.status.ok{color:#86efac}
.status.err{color:#fca5a5}
.inquiries{margin:22px 0 0;text-align:center;font-size:12px;color:#6f6f6f}
.inquiries a{color:#a3a3a3}
.page-links{
  display:flex;
  gap:18px;
  justify-content:center;
  padding:8px 16px 28px;
  font-size:12px;
}
.page-links a{color:#6f6f6f;text-decoration:none;font-weight:500}
.page-links a:hover,.inquiries a:hover{color:#d4d4d4}
a:focus-visible{outline:2px solid #bfdbfe;outline-offset:3px}
@media (max-width:480px){
  .stage{padding-top:36px}
  h1{font-size:28px}
}
</style>
</head>
<body>
<main class="stage" id="main">
  <div class="col">
    <a class="mark" href="../index.html"><img src="../logo.png" alt="DetailBot" width="28" height="28"></a>
    <!-- PLACEHOLDER COPY: Conor to replace -->
    <p class="badge">DetailBot waitlist</p>
    <!-- PLACEHOLDER COPY: Conor to replace -->
    <h1>Join the waitlist</h1>
    <p class="lede">DetailBot gives car detailing businesses proven Facebook ads. Sign up to hear when spots open.</p>
    <form id="waitlist-form" novalidate>
      <div class="hp" aria-hidden="true">
        <label for="hp-company">Company</label>
        <input id="hp-company" name="hp_company" type="text" tabindex="-1" autocomplete="off">
      </div>
      <label class="sr" for="email">Email Address</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="Your email address" aria-label="Email Address">
      <!-- PLACEHOLDER COPY: Conor to replace -->
      <button type="submit">Join the waitlist →</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="inquiries">For inquiries, contact us at: <a href="../support.html">Support</a></p>
  </div>
</main>
<nav class="page-links" aria-label="Site">
  <a href="../index.html">Home</a>
  <a href="../privacy.html">Privacy</a>
  <a href="../support.html">Support</a>
</nav>
<noscript><p class="status err">JavaScript is required to join the waitlist.</p></noscript>
<script>
(function () {
  var ENDPOINT = "https://qduetlexnpozzhojhlct.supabase.co/rest/v1/waitlist";
  var KEY = "sb_publishable_fHEdHOWY6zm8H4OvjMkN0g_gdO173xp";
  var form = document.getElementById("waitlist-form");
  var emailEl = document.getElementById("email");
  var honey = document.getElementById("hp-company");
  var statusEl = document.getElementById("status");
  var button = form.querySelector("button[type=submit]");
  var buttonLabel = button.textContent;
  var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function setStatus(kind, message) {
    statusEl.className = "status" + (kind ? " " + kind : "");
    statusEl.textContent = message;
    statusEl.setAttribute("role", kind === "err" ? "alert" : "status");
  }

  function finishSuccess() {
    setStatus("ok", "You're on the waitlist.");
    button.disabled = true;
    button.textContent = "Joined";
    button.setAttribute("aria-busy", "false");
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (button.disabled) return;

    if (honey.value.trim() !== "") {
      finishSuccess();
      return;
    }

    var email = emailEl.value.trim().toLowerCase();
    if (!emailPattern.test(email)) {
      setStatus("err", "Enter a valid email address.");
      emailEl.setAttribute("aria-invalid", "true");
      emailEl.focus();
      return;
    }
    emailEl.removeAttribute("aria-invalid");
    setStatus("", "");
    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    button.textContent = "Joining\u2026";

    fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "apikey": KEY,
        "Authorization": "Bearer " + KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        email: email,
        source: "getdetailbot.com/waitlist",
        user_agent: navigator.userAgent
      })
    }).then(function (res) {
      if (res.ok) {
        finishSuccess();
        return;
      }
      return res.json().catch(function () { return {}; }).then(function (err) {
        var duplicate = res.status === 409 || (err && (err.code === "23505" || /duplicate/i.test(err.message || "")));
        setStatus("err", duplicate ? "That email is already on the waitlist." : "Something went wrong. Please try again.");
        button.disabled = false;
        button.setAttribute("aria-busy", "false");
        button.textContent = buttonLabel;
      });
    }).catch(function () {
      setStatus("err", "Something went wrong. Please try again.");
      button.disabled = false;
      button.setAttribute("aria-busy", "false");
      button.textContent = buttonLabel;
    });
  });
})();
</script>
</body>
</html>
