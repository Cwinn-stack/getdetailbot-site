<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the DetailBot waitlist</title>
<meta name="description" content="DetailBot gives car detailing businesses proven Facebook ads. Sign up to hear when spots open.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="canonical" href="https://getdetailbot.com/waitlist">
<meta property="og:title" content="Join the DetailBot waitlist">
<meta property="og:description" content="DetailBot gives car detailing businesses proven Facebook ads. Sign up to hear when spots open.">
<meta property="og:url" content="https://getdetailbot.com/waitlist">
<meta property="og:type" content="website">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:#f4f4f5;
  background-color:#09090b;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.032) 0 1px,transparent 1px 7px);
  background-attachment:fixed;
  line-height:1.5;
}
.hang{
  width:min(420px,calc(100% - 32px));
  display:flex;
  flex-direction:column;
  align-items:center;
  flex:1 0 auto;
  padding-top:78px;
  position:relative;
}
.strap{
  position:absolute;
  top:0;
  left:50%;
  width:46px;
  height:96px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#1e3a8a 0%,#2563eb 18%,#eff6ff 46%,#60a5fa 58%,#1d4ed8 100%);
  box-shadow:0 0 12px rgba(59,130,246,.85),0 0 28px rgba(37,99,235,.45);
  z-index:3;
}
.card{
  width:100%;
  position:relative;
  z-index:2;
  background:linear-gradient(180deg,#242429 0%,#1a1a1f 100%);
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  padding:40px 26px 18px;
  box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
}
.slot{
  position:absolute;
  top:14px;
  left:50%;
  width:92px;
  height:16px;
  transform:translateX(-50%);
  border-radius:8px;
  background:#050507;
  box-shadow:inset 0 3px 5px rgba(0,0,0,.95),inset 0 -1px 0 rgba(255,255,255,.18),0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;
  z-index:4;
}
.slot::before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:46px;
  height:100%;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#1e3a8a 0%,#2563eb 18%,#eff6ff 46%,#60a5fa 58%,#1d4ed8 100%);
}
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin:6px 0 18px;
  color:#d4d4d8;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
  letter-spacing:-.01em;
}
.brand img{width:26px;height:26px;border-radius:7px;display:block}
h1{
  margin:0 0 8px;
  text-align:center;
  font-size:30px;
  line-height:1.15;
  letter-spacing:-.03em;
  font-weight:800;
}
.lede{
  margin:0 0 22px;
  text-align:center;
  color:#a1a1ab;
  font-size:15px;
}
.field{margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#ececf1}
.opt{font-weight:500;color:#8d8d98}
input[type="email"],input[type="tel"]{
  width:100%;
  appearance:none;
  background:#121216;
  border:1px solid #3f3f48;
  color:#fff;
  border-radius:12px;
  padding:12px 14px;
  font:inherit;
  font-size:16px;
}
input::placeholder{color:#5c5c68}
input:focus{outline:2px solid #60a5fa;outline-offset:1px;border-color:#60a5fa}
input[aria-invalid="true"]{border-color:#f87171}
input:-webkit-autofill{
  -webkit-text-fill-color:#fff;
  caret-color:#fff;
  box-shadow:0 0 0 1000px #121216 inset;
}
.hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
.consent{margin:8px 0 0;font-size:12px;line-height:1.45;color:#9a9aa6}
button{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font:inherit;
  font-size:16px;
  font-weight:700;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(180deg,#6d7bff 0%,#3d4ef5 42%,#2f6bff 100%);
  box-shadow:0 0 22px rgba(79,100,255,.55),0 10px 24px rgba(37,70,255,.35);
}
button:hover{filter:brightness(1.06)}
button:focus-visible{outline:2px solid #bfdbfe;outline-offset:2px}
button:disabled{cursor:progress;filter:saturate(.75) brightness(.88)}
.status{min-height:1.2em;margin:12px 0 0;text-align:center;font-size:14px;font-weight:600}
.status.ok{color:#86efac}
.status.err{color:#fca5a5}
.inquiries{margin:16px 0 4px;text-align:center;font-size:12px;color:#8d8d98}
.inquiries a{color:#d4d4dc}
.page-links{
  display:flex;
  gap:18px;
  justify-content:center;
  padding:18px 16px 28px;
  font-size:13px;
}
.page-links a{color:#8d8d98;text-decoration:none;font-weight:600}
.page-links a:hover,.inquiries a:hover{color:#fff}
@media (max-width:480px){
  .hang{padding-top:52px}
  .strap{height:68px}
  .card{padding:36px 18px 16px;border-radius:18px}
  h1{font-size:26px}
  button{padding:14px 16px}
}
</style>
</head>
<body>
<div class="hang">
  <div class="strap" aria-hidden="true"></div>
  <main class="card" id="main">
    <div class="slot" aria-hidden="true"></div>
    <a class="brand" href="../index.html"><img src="../logo.png" alt="" width="26" height="26"><span>DetailBot</span></a>
    <!-- PLACEHOLDER COPY: Conor to replace -->
    <h1>Join the waitlist</h1>
    <p class="lede">DetailBot gives car detailing businesses proven Facebook ads. Sign up to hear when spots open.</p>
    <form id="waitlist-form" novalidate>
      <div class="hp" aria-hidden="true">
        <label for="hp-company">Company</label>
        <input id="hp-company" name="hp_company" type="text" tabindex="-1" autocomplete="off">
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="phone">Phone <span class="opt">optional</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
        <p class="consent">The phone number is optional and won't be used for text messages without separate consent.</p>
      </div>
      <!-- PLACEHOLDER COPY: Conor to replace -->
      <button type="submit">Join the waitlist</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="inquiries">For inquiries, contact us at: <a href="../support.html">Support</a></p>
  </main>
</div>
<nav class="page-links" aria-label="Site">
  <a href="../index.html">Home</a>
  <a href="../privacy.html">Privacy</a>
  <a href="../support.html">Support</a>
</nav>
<noscript><p class="status err">JavaScript is required to join the waitlist.</p></noscript>
<script>
(function () {
  var ENDPOINT = "https://qduetlexnpozzhojhlct.supabase.co/rest/v1/waitlist";
  var KEY = "sb_publishable_fHEdHOWY6zm8H4OvjMkN0g_gdO173xp";
  var form = document.getElementById("waitlist-form");
  var emailEl = document.getElementById("email");
  var phoneEl = document.getElementById("phone");
  var honey = document.getElementById("hp-company");
  var statusEl = document.getElementById("status");
  var button = form.querySelector("button[type=submit]");
  var buttonLabel = button.textContent;
  var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function setStatus(kind, message) {
    statusEl.className = "status" + (kind ? " " + kind : "");
    statusEl.textContent = message;
    statusEl.setAttribute("role", kind === "err" ? "alert" : "status");
  }

  function finishSuccess() {
    setStatus("ok", "You're on the waitlist.");
    button.disabled = true;
    button.textContent = "Joined";
    button.setAttribute("aria-busy", "false");
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (button.disabled) return;

    if (honey.value.trim() !== "") {
      finishSuccess();
      return;
    }

    var email = emailEl.value.trim().toLowerCase();
    var phone = phoneEl.value.trim();
    if (!emailPattern.test(email)) {
      setStatus("err", "Enter a valid email address.");
      emailEl.setAttribute("aria-invalid", "true");
      emailEl.focus();
      return;
    }
    emailEl.removeAttribute("aria-invalid");
    setStatus("", "");
    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    button.textContent = "Joining\u2026";

    fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "apikey": KEY,
        "Authorization": "Bearer " + KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        email: email,
        phone: phone ? phone : null,
        source: "getdetailbot.com/waitlist",
        user_agent: navigator.userAgent
      })
    }).then(function (res) {
      if (res.ok) {
        finishSuccess();
        return;
      }
      return res.json().catch(function () { return {}; }).then(function (err) {
        var duplicate = res.status === 409 || (err && (err.code === "23505" || /duplicate/i.test(err.message || "")));
        setStatus("err", duplicate ? "That email is already on the waitlist." : "Something went wrong. Please try again.");
        button.disabled = false;
        button.setAttribute("aria-busy", "false");
        button.textContent = buttonLabel;
      });
    }).catch(function () {
      setStatus("err", "Something went wrong. Please try again.");
      button.disabled = false;
      button.setAttribute("aria-busy", "false");
      button.textContent = buttonLabel;
    });
  });
})();
</script>
</body>
</html>
